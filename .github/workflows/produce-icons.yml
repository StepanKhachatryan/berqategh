# Converts produce photographs the moment they land in the repository.
#
# Someone drops apple.png into produce-images/ — from a laptop, from the GitHub
# web page, from a phone — and this turns it into the small WebP the app ships
# and commits it back. Nobody has to remember to run anything, and nobody needs
# Chromium on their own machine.
#
# It only ever writes to src/assets/produce/, and it runs only when the folder
# of originals actually changes.

name: Produce icons

on:
  push:
    paths:
      - 'produce-images/**'
      - 'scripts/build-produce-icons.mjs'
      - 'scripts/check-produce-names.mjs'
  workflow_dispatch:

permissions:
  contents: write

# A second upload while the first is still converting would otherwise race to
# push; queue them instead.
concurrency:
  group: produce-icons-${{ github.ref }}

jobs:
  icons:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci --no-audit --no-fund

      # Playwright is deliberately not a dependency of the app — the site
      # builds without it, and only this conversion needs a browser.
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium

      # Converts on the newest main and pushes, starting over if someone pushed
      # in the meantime. Rebasing a finished conversion onto newer uploads
      # conflicts in sources.json - which is how a delete followed quickly by
      # an upload once left the new pictures unconverted - while converting
      # again on top of them cannot.
      - name: Convert and commit the icons
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            npm run icons
            git add src/assets/produce
            if git diff --staged --quiet; then
              echo 'Nothing changed - every icon was already up to date.'
              exit 0
            fi
            git commit -m 'Rebuild produce icons'
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Main moved while converting; starting over (attempt ${attempt})."
            sleep $((attempt * 3))
          done
          exit 1

      # After the commit, so the pictures that are named right go live even
      # when one is not. A wrong name fails the run and GitHub emails about it.
      - name: Check every picture matches a crop
        run: npm run icons:check
