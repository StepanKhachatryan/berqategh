[build]
  command = "npm run build"
  publish = "dist"
  # Each production deploy costs credits, so skip the ones that cannot change
  # the site's code: photo originals, their converted pictures, the database
  # (Supabase, not Netlify), scripts, workflows and notes. Exit 0 = skip.
  #
  # The converted pictures are excluded too. Before, a picture upload was
  # skipped, but the NEXT upload saw the previous batch's converted files in
  # its diff and deployed - a minute before its own pictures were converted,
  # so it cost a deploy and still showed nothing new. Pictures now go live
  # with the next code change, or on purpose: a commit whose message contains
  # [deploy] always builds (the "Publish pictures" workflow makes one).
  ignore = "git log -1 --format=%B | grep -qF '[deploy]' && exit 1; git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)produce-images' ':(exclude)service-images' ':(exclude)service-logos' ':(exclude)src/assets/produce' ':(exclude)src/assets/services' ':(exclude)src/assets/logos' ':(exclude)supabase' ':(exclude)android' ':(exclude)scripts' ':(exclude).github' ':(exclude)*.md'"

[build.environment]
  NODE_VERSION = "20"

# The Android app's link to the site. Served from the database through an
# Edge Function, so the app's signing fingerprint can be added without a
# deploy (supabase/functions/assetlinks). Must stay above the SPA fallback.
[[redirects]]
  from = "/.well-known/assetlinks.json"
  to = "https://xkcjipuabawakdcewklq.supabase.co/functions/v1/assetlinks"
  status = 200
  force = true

# SPA fallback — every route is served by index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self)"
